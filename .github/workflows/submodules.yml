name: Pasang Submodule

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Identity Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pasang Ulang Submodule
        shell: bash
        run: |
          set -e

          reset_submodule() {
            local NAME="$1"
            local URL="$2"

            echo "=== Reset $NAME ==="

            git submodule deinit -f "$NAME" 2>/dev/null || true
            git rm -f "$NAME" 2>/dev/null || true

            rm -rf ".git/modules/$NAME"
            rm -rf "$NAME"

            git config -f .gitmodules --remove-section "submodule.$NAME" 2>/dev/null || true

            git submodule add "$URL" "$NAME"
          }

          reset_submodule "AndroidLibXrayLite" "https://github.com/2dust/AndroidLibXrayLite"
          reset_submodule "hev-socks5-tunnel" "https://github.com/heiher/hev-socks5-tunnel"

          git submodule sync --recursive
          git submodule update --init --recursive

          git add .gitmodules
          git add AndroidLibXrayLite
          git add hev-socks5-tunnel

          if ! git diff --cached --quiet; then
            git commit -m "🤖 Bot: Pasang ulang submodule AndroidLibXrayLite dan hev-socks5-tunnel"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          else
            echo "Tidak ada perubahan."
          fi